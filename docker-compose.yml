services:
  brickseeker:
    build: .
    image: brickseeker:latest
    container_name: brickseeker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Everything mutable: SQLite database, image cache, catalogue snapshots, secret key.
      - ./data:/data
    environment:
      # Optional password gate. Leave unset for an open LAN-only deployment.
      # BRICKSEEKER_PASSWORD: "change-me"
      #
      # Pin this in a real deployment: it encrypts the stored Rebrickable/Brickset/BrickLink
      # credentials. Left unset, one is generated into /data/secret.key on first run.
      # BRICKSEEKER_SECRET_KEY: "..."
      BRICKSEEKER_LOG_LEVEL: INFO
      # Set to false to never launch Chromium (drops lego.com/Amazon/Cdiscount prices,
      # keeps BrickLink and everything else).
      BRICKSEEKER_SCRAPING_ENABLED: "true"
    # Chromium needs more than Docker's default 64 MB of shared memory or it crashes mid-page.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

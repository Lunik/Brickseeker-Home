services:
  brickseeker:
    build: .
    image: brickseeker:latest
    container_name: brickseeker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Everything mutable: SQLite database, image cache, catalogue snapshots, secret key.
      - ./data:/data
    # `environment:` takes precedence over `env_file:` and would silently shadow whatever a
    # user sets in .env, so configuration lives only in .env / .env.example — see there.
    # required: false — the README's quick start is `docker compose up -d` with no setup step,
    # and an empty/absent .env is documented as a working configuration.
    env_file:
      - path: .env
        required: false
    # Chromium needs more than Docker's default 64 MB of shared memory or it crashes mid-page.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

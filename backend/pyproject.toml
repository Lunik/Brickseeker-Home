[project]
name = "brickseeker-backend"
version = "1.0.0"
description = "Self-hosted BrickSeeker API — LEGO set scanning, collection, pricing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "cryptography>=43",
    "apscheduler>=3.10",
    "python-multipart>=0.0.12",
    "playwright>=1.48",
    "reportlab>=4.2",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework's own idiom

[tool.ruff.lint.per-file-ignores]
# The scrapers embed JavaScript as string literals. Their accessory-rejection alternations are one
# regex each and cannot be wrapped without changing the pattern — and a `# noqa` inside the string
# would be injected into the page as invalid JS.
"app/services/scraping/amazon.py" = ["E501"]
"app/services/scraping/cdiscount.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

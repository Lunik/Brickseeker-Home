name: Build and publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the `latest` decision below needs every release tag and a
          # tag-push checkout otherwise carries only the ref that triggered it.
          #
          # Not `fetch-tags: true`, which looks like the narrower tool for this and is the reason
          # v0.2.0 failed to build the first time: on a *tag* push actions/checkout then asks git
          # to fetch both the commit SHA and refs/tags/<tag> into that same ref, and git refuses
          # ("Cannot fetch both … to refs/tags/v0.2.0"). It fails only on the tag pushes this step
          # exists to serve, so a green master build says nothing about it.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # `:latest` must only ever move *forward*. `metadata-action`'s own `latest=auto` tags any
      # semver push as latest, which walks the tag backwards the first time a patch is cut for an
      # older line — publishing v1.0.5 after v1.2.0 would hand every `:latest` user a downgrade,
      # silently. Comparing against every release tag instead makes that case a no-op.
      #
      # Pre-releases are excluded from both sides: `v1.3.0-rc1` neither claims `:latest` nor stops
      # `v1.2.0` from holding it, because the pattern below only ever matches a bare `vX.Y.Z`.
      - name: Decide whether this tag is the newest release
        id: latest
        run: |
          highest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -n "${highest}" ] && [ "${GITHUB_REF_NAME}" = "${highest}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=${GITHUB_REF_NAME} highest=${highest:-<none>}"

      # What the in-app footer shows. A release reports its tag; anything else reports the commit
      # it was built from, so a bug report off a nightly still says exactly which build.
      - name: Compute app version
        id: version
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) value="${GITHUB_REF_NAME}" ;;
            *)            value="nightly-$(git rev-parse --short HEAD)" ;;
          esac
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "app version: ${value}"

      # Four tag strategies, all from the same build:
      #   - `nightly` on every push to master
      #   - `vX.Y.Z` on a matching git tag (kept with its `v` prefix)
      #   - `latest` on that tag too, but only when it is the highest release (see above)
      #   - `<short sha>` on every build, regardless of which of the above applies
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.latest.outputs.is_latest == 'true' }}
            type=sha,prefix=,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BRICKSEEKER_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads conventional commits (feat/fix/...) since the previous tag and turns them into
      # a categorized changelog for the release body. Commits that don't follow the convention
      # are left out rather than mis-categorized. Fails hard when there is no previous tag
      # (e.g. the very first release), so that case falls back to a plain commit log below.
      - name: Generate changelog
        id: changelog
        continue-on-error: true
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          writeToFile: false

      - name: Fallback changelog (no previous tag)
        id: changelog_fallback
        if: steps.changelog.outcome == 'failure'
        run: |
          {
            echo "changes<<CHANGELOG_EOF"
            echo "_Première publication : pas de tag précédent pour un changelog par commits conventionnels._"
            echo ""
            git log --pretty='- %s (%h)'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Release-ready compose file: points at the just-published GHCR image instead of building
      # locally, so it works as a standalone download from the release page.
      - name: Prepare release compose file
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}:${{ github.ref_name }}
        run: |
          yq eval '.services.brickseeker.image = strenv(IMAGE_REF) | del(.services.brickseeker.build)' docker-compose.yml > docker-compose.release.yml

      - name: Write image reference file
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}@${DIGEST}"
          } > image-digest.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changes || steps.changelog_fallback.outputs.changes }}
          files: |
            docker-compose.release.yml
            image-digest.txt

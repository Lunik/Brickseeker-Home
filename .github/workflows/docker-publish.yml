name: Build and publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Three tag strategies, all from the same build:
      #   - `nightly` on every push to master
      #   - `vX.Y.Z` on a matching git tag (kept with its `v` prefix)
      #   - `<short sha>` on every build, regardless of which of the above applies
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern=v{{version}}
            type=sha,prefix=,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads conventional commits (feat/fix/...) since the previous tag and turns them into
      # a categorized changelog for the release body. Commits that don't follow the convention
      # are left out rather than mis-categorized. Fails hard when there is no previous tag
      # (e.g. the very first release), so that case falls back to a plain commit log below.
      - name: Generate changelog
        id: changelog
        continue-on-error: true
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          writeToFile: false

      - name: Fallback changelog (no previous tag)
        id: changelog_fallback
        if: steps.changelog.outcome == 'failure'
        run: |
          {
            echo "changes<<CHANGELOG_EOF"
            echo "_Première publication : pas de tag précédent pour un changelog par commits conventionnels._"
            echo ""
            git log --pretty='- %s (%h)'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Release-ready compose file: points at the just-published GHCR image instead of building
      # locally, so it works as a standalone download from the release page.
      - name: Prepare release compose file
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}:${{ github.ref_name }}
        run: |
          yq eval '.services.brickseeker.image = strenv(IMAGE_REF) | del(.services.brickseeker.build)' docker-compose.yml > docker-compose.release.yml

      - name: Write image reference file
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}@${DIGEST}"
          } > image-digest.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changes || steps.changelog_fallback.outputs.changes }}
          files: |
            docker-compose.release.yml
            image-digest.txt

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BrickSeeker">
  <!-- Full-bleed, no corner rounding: the OS applies its own mask shape (circle, squircle,
       rounded square) to whatever is here, so the background must run edge-to-edge. -->
  <rect width="64" height="64" fill="#E3000B"/>
  <!-- Same glyph as favicon.svg, scaled to ~70% and re-centered so it sits inside the standard
       maskable "safe zone" (an 80%-diameter circle) with real margin — at full size its bottom
       corners sit right at that circle's edge, which a round mask would clip. -->
  <g transform="translate(32 32) scale(0.7) translate(-32 -32)">
    <rect x="14" y="26" width="36" height="24" rx="3" fill="#fff"/>
    <rect x="19" y="18" width="10" height="10" rx="2.5" fill="#fff"/>
    <rect x="35" y="18" width="10" height="10" rx="2.5" fill="#fff"/>
    <circle cx="32" cy="38" r="7" fill="none" stroke="#E3000B" stroke-width="3"/>
    <line x1="37" y1="43" x2="43" y2="49" stroke="#E3000B" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
